<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-in - Família Feliz</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #242424; /* Fundo escuro padrão CustomTkinter */
        color: #ffffff;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background-color: #2b2b2b;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      h2 {
        color: #00d2ff; /* Ciano usado no painel Admin */
        margin-bottom: 10px;
        font-size: 24px;
      }
      p {
        color: #a0a0a0;
        margin-bottom: 30px;
      }
      input,
      select {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        background-color: #343638;
        border: 1px solid #444;
        color: #ffffff;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box; /* Evita que o padding quebre a largura */
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #00d2ff;
      }
      .btn-confirmar {
        background-color: #2ecc71;
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn-confirmar:hover {
        background-color: #27ae60;
      }
      .btn-voltar {
        display: inline-block;
        margin-top: 20px;
        color: #a0a0a0;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
      }
      .btn-voltar:hover {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Iniciar Rota</h2>
      <p>Selecione a demanda atribuída a você</p>

      <form method="POST">
        <input
          type="text"
          name="id_motorista"
          placeholder="Seu Nome ou ID"
          required
        />

        <!-- A caixa de seleção puxa os dados das colunas 3(Pessoa), 4(Rua) e 6(Veículo) -->
        <select name="id_veiculo" required>
          <option value="">Selecione a Demanda...</option>
          {% for d in demandas %}
          <option value="{{ d[6] }}">
            {{ d[3] }} | {{ d[4] }} (Carro: {{ d[6] }})
          </option>
          {% endfor %}
        </select>

        <input
          type="number"
          name="km_inicial"
          placeholder="Quilometragem Inicial"
          required
        />

        <button type="submit" class="btn-confirmar">Confirmar Check-in</button>
      </form>

      <a href="/" class="btn-voltar">← Voltar ao Início</a>
    </div>
  </body>
</html>
