<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Motorista - Família Feliz</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #242424;
        color: #ffffff;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background-color: #2b2b2b;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .icone-frota {
        font-size: 48px;
        margin-bottom: 10px;
      }
      h1 {
        color: #00d2ff;
        margin-bottom: 5px;
        font-size: 26px;
      }
      p {
        color: #a0a0a0;
        margin-bottom: 35px;
        font-size: 15px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin-bottom: 15px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        color: white;
        box-sizing: border-box;
        transition: background-color 0.3s;
      }
      .btn-checkin {
        background-color: #2ecc71;
      }
      .btn-checkin:hover {
        background-color: #27ae60;
      }
      .btn-checkout {
        background-color: #e74c3c;
      }
      .btn-checkout:hover {
        background-color: #c0392b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icone-frota">🚐</div>
      <h1>Família Feliz</h1>
      <p>Painel do Motorista</p>

      <a href="/checkin" class="btn btn-checkin">Fazer Check-in (Saída)</a>
      <a href="/checkout" class="btn btn-checkout">Fazer Check-out (Retorno)</a>
    </div>
  </body>
</html>
