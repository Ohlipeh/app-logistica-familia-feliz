<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-out - Família Feliz</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #242424;
        color: #ffffff;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background-color: #2b2b2b;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      h2 {
        color: #00d2ff;
        margin-bottom: 10px;
        font-size: 24px;
      }
      p {
        color: #a0a0a0;
        margin-bottom: 30px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        background-color: #343638;
        border: 1px solid #444;
        color: #ffffff;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #00d2ff;
      }
      textarea {
        resize: none;
        font-family: inherit;
      }
      .btn-confirmar {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn-confirmar:hover {
        background-color: #c0392b;
      }
      .btn-voltar {
        display: inline-block;
        margin-top: 20px;
        color: #a0a0a0;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
      }
      .btn-voltar:hover {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Registrar Retorno</h2>
      <p>Informe os dados de devolução do veículo</p>

      <form method="POST">
        <select name="id_veiculo" required>
          <option value="">Selecione o Veículo</option>
          {% for v in veiculos %}
          <option value="{{ v[0] }}">{{ v[1] }} - {{ v[2] }}</option>
          {% endfor %}
        </select>

        <input
          type="number"
          name="km_final"
          placeholder="Quilometragem Final"
          required
        />

        <textarea
          name="observacoes"
          placeholder="Observações do veículo (Ex: Pneu baixo, tanque na reserva...)"
          rows="3"
        ></textarea>

        <button type="submit" class="btn-confirmar">Confirmar Check-out</button>
      </form>

      <a href="/" class="btn-voltar">← Voltar ao Início</a>
    </div>
  </body>
</html>
